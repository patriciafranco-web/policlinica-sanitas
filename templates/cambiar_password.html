<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Policlínica Sanitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-sanitas { background-color: #b83a56 !important; }
        .btn-sanitas { background-color: #b83a56; color: white; }
        .btn-sanitas:hover { background-color: #962e45; color: white; }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h4 class="text-center fw-bold mb-3" style="color: #b83a56;">Cambiar Contraseña</h4>
        
        {% if mensaje %}
            <div class="alert alert-success py-2">{{ mensaje }}</div>
        {% endif %}
        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña Actual</label>
                <input type="password" name="password_actual" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Nueva Contraseña</label>
                <input type="password" name="nueva_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-sanitas w-100 fw-bold py-2">Actualizar Contraseña</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none text-muted small">← Volver al Panel Principal</a>
        </div>
    </div>

</body>
</html>

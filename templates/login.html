<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Policlínica Sanitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-sanitas { background-color: #b83a56 !important; }
        .text-sanitas { color: #b83a56 !important; }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow border-0 p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Sanitas" style="height: 70px;" class="mb-2 bg-white p-1 rounded shadow-sm">
            <h3 class="text-sanitas fw-bold">Policlínica Sanitas</h3>
            <p class="text-muted small">Ingrese sus credenciales para acceder</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 text-center small" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold small">Usuario:</label>
                <input type="text" class="form-control" name="username" placeholder="Ej. doctora, secretaria, ginecologia..." required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Contraseña:</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn bg-sanitas text-white w-100 fw-bold py-2 mt-2">Iniciar Sesión</button>
        </form>
        
        <div class="text-center mt-4 text-muted" style="font-size: 0.75rem;">
            <span>Sistema Multidisciplinario Local • Lambaré</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
